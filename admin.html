<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Chofer - Clima</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      margin: 0;
      text-align: center;
    }
    h2, h3 {
      color: #ff9800;
    }
    .seccion {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .temp-display {
      font-size: 2.5rem;
      font-weight: bold;
      color: #00e676;
      margin: 15px 0;
    }
    input[type="range"] {
      width: 100%;
      height: 12px;
      margin: 15px 0;
      accent-color: #00e676;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-enviar {
      background-color: #00e676;
      color: #000;
    }
    .btn-apagar {
      background-color: #d32f2f;
      color: white;
    }
  </style>
</head>
<body>

  <h2>🚗 Panel de Chofer</h2>

  <!-- 🌡️ Control de Clima con Barra Deslizable -->
  <div class="seccion">
    <h3>🌡️ Control de Clima</h3>
    
    <div class="temp-display" id="valor-temp-admin">22.0°C</div>

    <input type="range" id="range-temp-admin" min="18.0" max="32.0" step="0.5" value="22.0" oninput="actualizarLectura(this.value)">

    <button class="btn-enviar" onclick="enviarTemperaturaRemota()">✅ Aplicar Temperatura</button>
    <button class="btn-apagar" onclick="enviarApagadoRemoto()">❄️ Apagar AC</button>
  </div>

  <script>
    const CANAL_ADMIN = "didi_premier_admin_88";

    function actualizarLectura(valor) {
      const display = document.getElementById('valor-temp-admin');
      const numVal = parseFloat(valor);

      if (numVal === 32.0) {
        display.innerText = "HI (32.0°C)";
      } else if (numVal === 18.0) {
        display.innerText = "LO (18.0°C)";
      } else {
        display.innerText = `${numVal.toFixed(1)}°C`;
      }
    }

    function enviarTemperaturaRemota() {
      const val = parseFloat(document.getElementById('range-temp-admin').value);
      let mensaje = `${val.toFixed(1)}°C`;

      if (val === 32.0) mensaje = "HI";
      if (val === 18.0) mensaje = "LO";

      enviarComando(mensaje);
    }

    function enviarApagadoRemoto() {
      enviarComando("Apagado");
    }

    function enviarComando(valor) {
      fetch(`https://ntfy.sh/${CANAL_ADMIN}`, {
        method: 'POST',
        body: valor
      })
      .then(res => {
        if (res.ok) {
          console.log("Comando de clima enviado:", valor);
        }
      })
      .catch(err => console.error("Error al enviar comando:", err));
    }
  </script>
</body>
</html>
