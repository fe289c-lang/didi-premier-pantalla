<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control Chofer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      margin: 0;
      text-align: center;
    }
    h2, h3 {
      color: #ff9800;
    }
    .seccion {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-clima {
      background-color: #333;
      color: white;
      border: 1px solid #555;
    }
    .btn-apagar {
      background-color: #d32f2f;
      color: white;
    }
    .btn-enviar {
      background-color: #ff5252;
      color: white;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>🚗 Panel de Chofer</h2>

  <!-- 💬 Sección de Mensaje Emergente -->
  <div class="seccion">
    <h3>💬 Mensaje en Pantalla</h3>
    <input type="text" id="input-mensaje" placeholder="Ej: ¡Bienvenido! ¿Gusta una botella de agua?">
    <button class="btn-enviar" onclick="enviarMensajeEmergente()">📩 Enviar Mensaje</button>
  </div>

  <!-- 🌡️ Sección de Clima -->
  <div class="seccion">
    <h3>🌡️ Ajustar Clima Remoto</h3>
    <button class="btn-clima" onclick="enviarComandoClima('20.0°C')">❄️ 20.0°C (Fresco)</button>
    <button class="btn-clima" onclick="enviarComandoClima('22.0°C')">😊 22.0°C (Normal)</button>
    <button class="btn-clima" onclick="enviarComandoClima('24.0°C')">☀️ 24.0°C (Templado)</button>
    <button class="btn-apagar" onclick="enviarComandoClima('Apagado')">❌ Apagar AC</button>
  </div>

  <script>
    const CANAL_ADMIN = "didi_premier_admin_88";

    // Función para enviar mensajes emergentes
    function enviarMensajeEmergente() {
      const input = document.getElementById('input-mensaje');
      const mensaje = input.value.trim();

      if (mensaje === "") return;

      fetch(`https://ntfy.sh/${CANAL_ADMIN}`, {
        method: 'POST',
        body: `MSG: ${mensaje}`
      })
      .then(res => {
        if (res.ok) {
          alert("✅ Mensaje enviado a la tablet");
          input.value = "";
        } else {
          alert("❌ Error al enviar el mensaje");
        }
      })
      .catch(err => alert("❌ Error de red: " + err));
    }

    // Función para enviar cambios de clima
    function enviarComandoClima(valor) {
      fetch(`https://ntfy.sh/${CANAL_ADMIN}`, {
        method: 'POST',
        body: valor
      })
      .then(res => {
        if (res.ok) {
          console.log("Comando enviado:", valor);
        }
      })
      .catch(err => console.error("Error al enviar clima:", err));
    }
  </script>
</body>
</html>
